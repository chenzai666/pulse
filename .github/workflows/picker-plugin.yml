name: 验证 Listary 文件窗口适配器
on:
  workflow_call:
permissions:
  contents: read
jobs:
  plugin:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 编译并验证 Listary 官方发现规则
        shell: pwsh
        run: |
          $project='integrations/Listary.Picker/Listary.FileAppPlugin.PulsePicker.csproj'
          dotnet restore $project --locked-mode --configfile integrations/Listary.Picker/NuGet.config --nologo
          if ($LASTEXITCODE) { throw '依赖验证失败' }
          dotnet build $project -c Release --no-restore --nologo -o out/picker-plugin
          if ($LASTEXITCODE) { throw '编译失败' }
          & ./integrations/Listary.Picker/verify_discovery.ps1 -PluginPath out/picker-plugin/Listary.FileAppPlugin.PulsePicker.dll
          $tests='integrations/Listary.Picker/tests/PickerProtocol.csproj'
          dotnet restore $tests --locked-mode --configfile integrations/Listary.Picker/NuGet.config --nologo
          if ($LASTEXITCODE) { throw '协议测试依赖验证失败' }
          dotnet build $tests -c Release --no-restore --nologo
          if ($LASTEXITCODE) { throw '协议测试编译失败' }
          & ./out/listary-plugin/bin/PickerProtocol/Release/net48/pulse.exe
          if ($LASTEXITCODE) { throw 'Listary 路径协议测试失败' }
          Copy-Item integrations/Listary.Picker/README.md out/picker-plugin/
      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-Listary-picker-plugin
          path: out/picker-plugin/**
