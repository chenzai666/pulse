name: 验证原版弹窗与系统集成设置
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  picker:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 移除弹窗接管并验证设置及内部选择器
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build_picker_ci.ps1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Pulse-Custom-picker-update
          path: build-custom/picker-update/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pulse-Custom-picker-verification
          path: |
            build-custom/picker-verification/**
            build-custom/*.log
