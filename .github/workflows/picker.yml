name: 构建文件选择窗口与系统集成
on:
  workflow_dispatch:
    inputs:
      drive_capacity_validation:
        type: boolean
        default: false
      listary_search_validation:
        type: boolean
        default: false
      build_only:
        description: '仅构建正式程序，界面验收由用户完成'
        type: boolean
        default: false
      publish_release:
        description: '发布最新 v1.0.53 弹窗修复安装包'
        type: boolean
        default: false
      recycle_validation:
        type: boolean
        default: false
      operation_progress_validation:
        type: boolean
        default: false
      reuse_removal_verification:
        description: '设置及选择器源码未变时复用已通过的移除回归'
        type: boolean
        default: false
  workflow_call:
    inputs:
      drive_capacity_validation:
        type: boolean
        default: false
      listary_search_validation:
        type: boolean
        default: false
      operation_progress_validation:
        type: boolean
        default: false
      recycle_validation:
        type: boolean
        default: false
      build_only:
        type: boolean
        default: false
      publish_release:
        type: boolean
        default: false
      reuse_removal_verification:
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
jobs:
  picker:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        if: inputs.listary_search_validation
        with:
          dotnet-version: '8.0.x'
      - name: 构建文件选择窗口及内部选择器
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build_picker_ci.ps1 -ReuseRemovalVerification:('${{ inputs.reuse_removal_verification }}' -eq 'true') -BuildOnly:('${{ inputs.build_only }}' -eq 'true') -RecycleValidation:('${{ inputs.recycle_validation }}' -eq 'true') -OperationProgressValidation:('${{ inputs.operation_progress_validation }}' -eq 'true') -ListarySearchValidation:('${{ inputs.listary_search_validation }}' -eq 'true') -DriveCapacityValidation:('${{ inputs.drive_capacity_validation }}' -eq 'true')
      - name: 制作并发布最新弹窗修复安装包
        if: inputs.publish_release == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PICKER_USER_VALIDATION: ${{ inputs.build_only }}
          PULSE_RECYCLE_VALIDATION: ${{ inputs.recycle_validation }}
          PULSE_PROGRESS_VALIDATION: ${{ inputs.operation_progress_validation }}
          PULSE_LISTARY_SEARCH_VALIDATION: ${{ inputs.listary_search_validation }}
          PULSE_DRIVE_CAPACITY_VALIDATION: ${{ inputs.drive_capacity_validation }}
        run: ./scripts/publish_picker_release.ps1
      - uses: actions/upload-artifact@v4
        if: inputs.publish_release == true && success()
        with:
          name: Pulse-Custom-installer
          path: dist-installer/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Pulse-Custom-picker-update
          path: build-custom/picker-update/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pulse-Custom-picker-verification
          path: |
            build-custom/picker-verification/**
            build-custom/*.log
