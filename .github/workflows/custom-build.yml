name: 构建 Pulse 定制版

on:
  push:
    branches: [feature/files-integrations]
  workflow_dispatch:
    inputs:
      validation_scope:
        description: '验证范围：完整集成、属性界面或标签／回收站／原生预览／搜索修复'
        type: choice
        options: [full, properties, native-fixes, tab-drag, tab-drag-diagnostics, file-ui]
        default: full
      verify_settings_regression:
        description: '先验证设置页相邻场景在旧实现失败，再验证修复版本'
        type: boolean
        default: false
      home_widgets_only:
        description: 'file-ui 范围中仅验证主页和侧边栏设置'
        type: boolean
        default: false
      home_menu_only:
        description: 'file-ui 范围中仅验证最近访问右键固定和新标签页默认主页'
        type: boolean
        default: false
      home_path_display_only:
        description: 'file-ui 范围中仅验证主页最近访问路径显示'
        type: boolean
        default: false
      native_dialogs_only:
        description: 'file-ui 范围中仅验证第三方文件选择窗口、保存模式和关闭接管恢复'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: pulse-custom-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: inputs.validation_scope == 'properties' || inputs.validation_scope == 'native-fixes' || (inputs.validation_scope == 'tab-drag' || inputs.validation_scope == 'tab-drag-diagnostics' || inputs.validation_scope == 'file-ui')
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/cache/restore@v4
        if: inputs.validation_scope != 'properties' && inputs.validation_scope != 'native-fixes' && inputs.validation_scope != 'tab-drag' && inputs.validation_scope != 'tab-drag-diagnostics' && inputs.validation_scope != 'file-ui'
        id: conversion_ffmpeg_cache
        with:
          path: build-custom/conversion-ffmpeg-source-runtime
          key: conversion-ffmpeg-windows-2022-v1-${{ hashFiles('scripts/build_conversion_ffmpeg.sh') }}
      - uses: msys2/setup-msys2@v2
        if: inputs.validation_scope != 'properties' && inputs.validation_scope != 'native-fixes' && inputs.validation_scope != 'tab-drag' && inputs.validation_scope != 'tab-drag-diagnostics' && inputs.validation_scope != 'file-ui' && steps.conversion_ffmpeg_cache.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: false
          install: >-
            make nasm pkgconf curl tar xz
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
      - name: 从固定源码构建常见音视频转换组件
        if: inputs.validation_scope != 'properties' && inputs.validation_scope != 'native-fixes' && inputs.validation_scope != 'tab-drag' && inputs.validation_scope != 'tab-drag-diagnostics' && inputs.validation_scope != 'file-ui' && steps.conversion_ffmpeg_cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build_conversion_ffmpeg.sh
      - uses: actions/cache/save@v4
        if: inputs.validation_scope != 'properties' && inputs.validation_scope != 'native-fixes' && inputs.validation_scope != 'tab-drag' && inputs.validation_scope != 'tab-drag-diagnostics' && inputs.validation_scope != 'file-ui' && steps.conversion_ffmpeg_cache.outputs.cache-hit != 'true'
        with:
          path: build-custom/conversion-ffmpeg-source-runtime
          key: conversion-ffmpeg-windows-2022-v1-${{ hashFiles('scripts/build_conversion_ffmpeg.sh') }}
      - name: 构建和验证完整定制版
        if: inputs.validation_scope != 'properties' && inputs.validation_scope != 'native-fixes' && inputs.validation_scope != 'tab-drag' && inputs.validation_scope != 'tab-drag-diagnostics' && inputs.validation_scope != 'file-ui'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build_custom_ci.ps1
      - name: 构建并验证 Pulse 属性窗口
        if: inputs.validation_scope == 'properties'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build_properties_ci.ps1
      - name: 构建并验证原生功能修复
        if: inputs.validation_scope == 'native-fixes'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build_native_fixes_ci.ps1
      - name: 验证标签真实输入流程
        if: (inputs.validation_scope == 'tab-drag' || inputs.validation_scope == 'tab-drag-diagnostics' || inputs.validation_scope == 'file-ui')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ('${{ inputs.validation_scope }}' -eq 'tab-drag-diagnostics') {
            ./scripts/build_tab_drag_ci.ps1 -DiagnosticsOnly
          } elseif ('${{ inputs.validation_scope }}' -eq 'file-ui') {
            ./scripts/build_tab_drag_ci.ps1 -FileUi -HomeWidgetsOnly:('${{ inputs.home_widgets_only }}' -eq 'true') -HomeMenuOnly:('${{ inputs.home_menu_only }}' -eq 'true') -HomePathDisplayOnly:('${{ inputs.home_path_display_only }}' -eq 'true') -NativeDialogsOnly:('${{ inputs.native_dialogs_only }}' -eq 'true')
          } else {
            ./scripts/build_tab_drag_ci.ps1 -VerifySettingsRegression:('${{ inputs.verify_settings_regression }}' -eq 'true')
          }
      - uses: actions/upload-artifact@v4
        if: (inputs.validation_scope == 'tab-drag' || inputs.validation_scope == 'tab-drag-diagnostics' || inputs.validation_scope == 'file-ui') && success()
        with:
          name: Pulse-Custom-tab-update
          path: build-custom/tab-update/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        # 完整运行时保留，原生修复仅执行与本次变化相关的回归。
        with:
          name: Pulse-Custom-complete
          path: |
            dist/Pulse-Custom-*.zip
            dist/Pulse-Custom-*.sha256
            dist/custom-build.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pulse-Custom-build-diagnostics
          path: |
            build-custom/*.log
            bench_data/selftest_1b2_last.log
            bench_data/tab-transfer/results.log
            bench_data/tab-drag-input/results.log
            bench_data/list-checkbox/**
            bench_data/recycle_place_menu_test.log
            bench_data/recycle-toolbar/**
            bench_data/home-widgets*
            bench_data/home-*.png
            bench_data/native-dialogs*
            bench_data/native-dialogs*/**
            bench_data/picker*/*
            bench_data/home-widgets/**
            bench_data/m10005_tab_pin_boundary.log
            bench_data/file-conversion-ui.log
            build-custom/delete-confirmation-zh/*.png
            build-custom/delete-confirmation-en/*.png
            build-custom/status-center-gallery/*.png
            build-custom/status-center-gallery/*.txt
            build-custom/properties-gallery/*.png
            build-custom/properties-gallery/*.txt
            build-custom/native-image-ui.png
            bench_data/listary-search-entry/*.log
          if-no-files-found: ignore
